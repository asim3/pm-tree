# Milestone template. Copy it to pm/M<n>-<slug>/milestone.yaml and replace every value.
# Every key is required. The format and its rules: run `pm-tree --docs` for its README.md.
id: M1                     # M<n>; must match the folder name M<n>-<slug>
title: Short milestone title
status: planned            # planned | active | done
spec: "Milestones, M1"     # where SPEC.md defines this milestone, with its goal and gate criteria

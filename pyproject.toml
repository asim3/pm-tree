[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm-tree"
version = "1.0.0"
description = "A strict, file-based project-management format, worked by Claude Code, and its validator."
readme = "src/pm_tree/README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
pm-tree = "pm_tree.validate:main"

[tool.hatch.build.targets.sdist]
include = ["src/pm_tree", "tests", "README.md", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
